{% extends "base.html" %}
{% block title %}Stock Overview · Añelo{% endblock %}
{% block body %}
<div class="brandbar"><span class="brandword">HALLIBURTON</span></div>
<header class="top">
  <div class="inner">
    <div class="titlebar">
      <div>
        <h1>Stock Overview</h1>
        <div class="sub-sap">Planta 1608 · Añelo 1117</div>
      </div>
      <button class="adm" id="btnAdm">Administrar</button>
    </div>
    <div class="searchbox">
      <input id="q" type="search" placeholder="Código, descripción o ubicación" autocomplete="off">
      <button class="clear" id="clear">×</button>
    </div>
  </div>
</header>

<div class="wrap">
  <div class="bar"><span id="count"></span><button class="chip" id="chipSin">Sin ubicación</button></div>
  <div id="results"></div>
</div>

<div class="backdrop" id="backdrop"><div class="sheet" id="sheet"></div></div>
<input type="file" id="file" accept=".xlsx,.xls" style="display:none">
<div class="toast" id="toast"></div>

<script src="/static/app.js"></script>
{% endblock %}
