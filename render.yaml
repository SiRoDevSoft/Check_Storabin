databases:
  - name: materiales-db
    plan: free
    databaseName: materiales
    user: materiales

services:
  - type: web
    name: materiales-app
    runtime: python
    plan: free
    buildCommand: "pip install -r requirements.txt"
    startCommand: "uvicorn app.main:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: materiales-db
          property: connectionString
